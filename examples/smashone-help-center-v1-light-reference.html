<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmashOne · Help Center concepts</title>
  <link rel="stylesheet" href="help.css" />
  <style>
    /* Canvas wrapper resets */
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: "Inter", system-ui, sans-serif; }

    /* Each artboard is an isolated themed surface, fixed-size frame.
       We make it scroll inside so the user can preview the full page
       inside its frame OR open the artboard fullscreen for the real height. */
    .artboard-page {
      width: 100%; height: 100%;
      overflow-y: auto; overflow-x: hidden;
      background: var(--surface-base);
      color: var(--text-primary);
      scrollbar-width: thin;
    }
    .artboard-page .surface { min-height: auto; }

    /* Token table card */
    .toktable {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 14px;
      color: #2a251f;
      border: 1px solid rgba(0,0,0,0.06);
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
    .toktable h3 {
      font-family: "Onest", system-ui, sans-serif;
      font-size: 18px; font-weight: 620; letter-spacing: -0.012em;
      margin: 24px 0 10px;
      color: rgba(0,0,0,0.92);
    }
    .toktable h3:first-child { margin-top: 0; }
    .toktable table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .toktable td { padding: 8px 8px 8px 0; border-bottom: 1px solid rgba(0,0,0,0.06); vertical-align: middle; }
    .toktable td.swatch { width: 28px; }
    .swatch-chip {
      width: 24px; height: 24px; border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.08);
      display: inline-block;
    }
    .toktable td.name { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: rgba(0,0,0,0.72); }
    .toktable td.val { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: rgba(0,0,0,0.54); }
    .toktable td.desc { color: rgba(0,0,0,0.62); font-size: 13px; }
    .type-sample {
      font-family: "Onest", system-ui, sans-serif;
      color: rgba(0,0,0,0.92);
    }

    /* Atoms gallery card */
    .atoms {
      background: #ffffff;
      width: 100%; height: 100%;
      overflow-y: auto;
      padding: 0;
    }
    .atoms .surface { background: #ffffff; }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="SharedChrome.jsx"></script>
  <script type="text/babel" src="HelpLanding.jsx"></script>
  <script type="text/babel" src="ArticlePage.jsx"></script>
  <script type="text/babel" src="SearchAndEmpty.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
