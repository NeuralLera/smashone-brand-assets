<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmashOne · US client onboarding wizard</title>
<link rel="stylesheet" href="smashone-tokens.css" />
<link rel="stylesheet" href="wizard.css" />
<style>
  body { margin: 0; background: #f0eee9; font-family: var(--font-body); }
  /* Artboard host needs to clip rounded corners on inner stuff */
  .ab-host { overflow: hidden; border-radius: inherit; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wizard-atoms.jsx"></script>
<script type="text/babel" src="wizard-gallery.jsx"></script>
<script type="text/babel" src="wizard-steps.jsx"></script>
<script type="text/babel" src="wizard-steps-billing.jsx"></script>

<script type="text/babel" data-presets="env,react">
const Wrap = ({ children }) => (
  <div className="ab-host" data-theme="light" style={{ width: "100%", height: "100%", background: "var(--surface-base)" }}>
    {children}
  </div>
);

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="system"
        title="0 · Design system"
        subtitle="Tokens, type scale, atoms, and component states shared by every wizard surface."
      >
        <DCArtboard id="gallery" label="Tokens & component gallery" width={1280} height={2400}>
          <Wrap><Gallery /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step0"
        title="1 · Step 0 — Welcome"
        subtitle="First impression. Sparkle hero, sentence-case display, first-person CTA, $0-today trust line."
      >
        <DCArtboard id="step0-desktop" label="Desktop · 1440 (wizard 720 centered)" width={1080} height={880}>
          <Wrap><Step0Welcome /></Wrap>
        </DCArtboard>
        <DCArtboard id="step0-mobile" label="Mobile · ≤640" width={380} height={760}>
          <Wrap><Step0Welcome mobile /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step05"
        title="2 · Step 0.5 — Path router"
        subtitle="User self-identifies acquisition path. Selected state shown on Path 2a (organic). Branches Day-15 billing math."
      >
        <DCArtboard id="step05-desktop" label="Desktop · selected Path 2a" width={1080} height={1020}>
          <Wrap><Step0_5PathRouter selected="path2a" /></Wrap>
        </DCArtboard>
        <DCArtboard id="step05-mobile" label="Mobile · selected Path 1" width={380} height={1280}>
          <Wrap><Step0_5PathRouter mobile selected="path1" /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step1"
        title="3 · Step 1 — Business profile"
        subtitle="Four required fields. Right artboard shows the inline-error pattern (aria-live polite, role=alert, icon+color+text 3-channel)."
      >
        <DCArtboard id="step1-desktop" label="Desktop · default" width={1080} height={1080}>
          <Wrap><Step1Business /></Wrap>
        </DCArtboard>
        <DCArtboard id="step1-error" label="Desktop · validation error" width={1080} height={1080}>
          <Wrap><Step1Business showError /></Wrap>
        </DCArtboard>
        <DCArtboard id="step1-mobile" label="Mobile" width={380} height={1180}>
          <Wrap><Step1Business mobile /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step2"
        title="4 · Step 2 — Connect first platform"
        subtitle="2 connected + 1 not connected + AI auto · Wave 2 disabled row. Right artboard shows the connect modal overlay."
      >
        <DCArtboard id="step2-desktop" label="Desktop · 2 connected, modal closed" width={1080} height={1340}>
          <Wrap><Step2Platforms /></Wrap>
        </DCArtboard>
        <DCArtboard id="step2-modal" label="Desktop · Telegram OAuth modal" width={1080} height={1340}>
          <Wrap><Step2Platforms showModal /></Wrap>
        </DCArtboard>
        <DCArtboard id="step2-mobile" label="Mobile" width={380} height={1620}>
          <Wrap><Step2Platforms mobile /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step3"
        title="5 · Step 3 — Create first draft (optional)"
        subtitle="Industry-conditional starter post (restaurant template shown). Multi-platform tabs, AI variations, hashtag chips. Right artboard adds the Path 1/3/4 'your automator can do this' info card."
      >
        <DCArtboard id="step3-desktop" label="Desktop · self-service" width={1080} height={1280}>
          <Wrap><Step3Draft /></Wrap>
        </DCArtboard>
        <DCArtboard id="step3-automator" label="Desktop · Path 1/3/4 automator hint" width={1080} height={1340}>
          <Wrap><Step3Draft isAutomatorPath /></Wrap>
        </DCArtboard>
        <DCArtboard id="step3-mobile" label="Mobile" width={380} height={1500}>
          <Wrap><Step3Draft mobile /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step4"
        title="6 · Step 4 — Billing preview"
        subtitle="Conditional Day 15 math. Left: Path 2a/2b $79-only. Right: Path 1/3/4 $278 unified (sub + setup). Acknowledgement gate, DSA-compliant transparency."
      >
        <DCArtboard id="step4-self" label="Path 2a/2b · $79 only · no card" width={1080} height={1480}>
          <Wrap><Step4Billing path="self" acknowledged={false} /></Wrap>
        </DCArtboard>
        <DCArtboard id="step4-automator" label="Path 1/3/4 · $278 unified · card linked · acknowledged" width={1080} height={1480}>
          <Wrap><Step4Billing path="automator" acknowledged={true} /></Wrap>
        </DCArtboard>
        <DCArtboard id="step4-mobile" label="Mobile · Path 2a/2b" width={380} height={2000}>
          <Wrap><Step4Billing path="self" mobile /></Wrap>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="step5"
        title="7 · Step 5 — All set / Automator handoff"
        subtitle="Conditional celebration screens. Left: Path 2a/2b self-service 'You're all set' (sparkle micro-animation). Right: Path 1/3/4 'Your automator is on it' with live setup progress."
      >
        <DCArtboard id="step5-self" label="Path 2a/2b · self-service celebration" width={1080} height={1400}>
          <Wrap><Step5SelfService /></Wrap>
        </DCArtboard>
        <DCArtboard id="step5-automator" label="Path 1/3/4 · automator handoff in progress" width={1080} height={1480}>
          <Wrap><Step5Automator /></Wrap>
        </DCArtboard>
        <DCArtboard id="step5-self-mobile" label="Mobile · Path 2a/2b" width={380} height={1800}>
          <Wrap><Step5SelfService mobile /></Wrap>
        </DCArtboard>
        <DCArtboard id="step5-auto-mobile" label="Mobile · Path 1/3/4" width={380} height={1900}>
          <Wrap><Step5Automator mobile /></Wrap>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
