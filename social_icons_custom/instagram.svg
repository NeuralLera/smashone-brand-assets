<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Instagram">
  <defs>
    <!-- Официальный сочный градиент Instagram по диагонали -->
    <linearGradient id="instaGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCAF45" />
      <stop offset="25%" stop-color="#F56040" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="75%" stop-color="#C13584" />
      <stop offset="100%" stop-color="#405DE6" />
    </linearGradient>
  </defs>

  <!-- 1. Контур камеры и объектив в фирменном градиенте -->
  <g fill="none" stroke="url(#instaGradient)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16.4" y="16.4" width="31.2" height="31.2" rx="8.2" ry="8.2"></rect>
    <circle cx="32" cy="32" r="7.2"></circle>
  </g>

  <!-- 2. Вспышка камеры — наша фирменная золотая точка в цвете #b08930 -->
  <circle cx="41.6" cy="22.4" r="1.7" fill="#b08930"></circle>
</svg>
