    <rect width="64" height="64" fill="url(#base)" opacity="0.75"></rect>
    <rect width="64" height="64" fill="url(#strie)"></rect>
    <rect width="64" height="64" fill="url(#warm)"></rect>
    <rect width="64" height="64" fill="url(#innerglow)"></rect>
    <rect width="64" height="64" fill="#000000" filter="url(#noise)" opacity="0.35" style="mix-blend-mode:overlay"></rect>
    <rect width="64" height="64" fill="url(#topedge)"></rect>
  </g>

  
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" ry="13.4" fill="none" stroke="#c0c0c0" stroke-opacity="0.30" stroke-width="1.2"></rect>

  
