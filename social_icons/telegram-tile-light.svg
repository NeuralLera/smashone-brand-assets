<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Telegram">
  <defs>
    <linearGradient id="tgbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"></stop>
      <stop offset="1" stop-color="#e4e4e4"></stop>
    </linearGradient>
    <pattern id="tggrain" width="3" height="2" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.35"></rect>
      <rect y="1" width="3" height="1" fill="#000000" fill-opacity="0.015"></rect>
    </pattern>
    <radialGradient id="tgwarm" cx="0.85" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#b08930" stop-opacity="0.08"></stop>
      <stop offset="0.55" stop-color="#b08930" stop-opacity="0.02"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tgtopedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"></stop>
      <stop offset="0.08" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="tginnerglow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tgbottomshade" x1="0" y1="0.7" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.06"></stop>
    </linearGradient>
    <clipPath id="tgtileclip">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14"></rect>
    </clipPath>
  </defs>

  <g clip-path="url(#tgtileclip)">
    <rect width="64" height="64" fill="url(#tgbase)"></rect>
    <rect width="64" height="64" fill="url(#tggrain)" opacity="0.30"></rect>
    <rect width="64" height="64" fill="url(#tgwarm)"></rect>
    <rect width="64" height="64" fill="url(#tginnerglow)"></rect>
    <rect width="64" height="64" fill="url(#tgbottomshade)"></rect>
    <rect width="64" height="64" fill="url(#tgtopedge)"></rect>
  </g>

  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" ry="13.4" fill="none" stroke="#2a2a2a" stroke-opacity="0.18" stroke-width="1.2"></rect>

  
  <g fill="#0088CC">
    <path d="M 47 18&#xA;             L 17 30&#xA;             C 15.6 30.5 15.6 32 17.2 32.5&#xA;             L 25 35&#xA;             L 28.5 45.5&#xA;             C 29 47 30.4 47 31.2 46&#xA;             L 35.5 41.2&#xA;             L 42.5 46.4&#xA;             C 43.6 47.2 45 46.6 45.3 45.3&#xA;             L 49 21.2&#xA;             C 49.3 19.4 47.8 17.5 47 18 Z"></path>
    
    <path d="M 25 35 L 41.5 25 L 31.2 36 Z" fill="#0e6fa3" opacity="0.55"></path>
  </g>
</svg>