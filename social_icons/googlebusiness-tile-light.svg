    </linearGradient>
    <pattern id="gbpgrain" width="3" height="2" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.35"></rect>
      <rect y="1" width="3" height="1" fill="#000000" fill-opacity="0.015"></rect>
    </pattern>
    <radialGradient id="gbpwarm" cx="0.85" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#b08930" stop-opacity="0.08"></stop>
      <stop offset="0.55" stop-color="#b08930" stop-opacity="0.02"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="gbptopedge" x1="0" y1="0" x2="0" y2="1">
