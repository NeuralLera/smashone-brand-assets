    <rect width="64" height="64" fill="url(#gbpgrain)" opacity="0.30"></rect>
    <rect width="64" height="64" fill="url(#gbpwarm)"></rect>
    <rect width="64" height="64" fill="url(#gbpinnerglow)"></rect>
    <rect width="64" height="64" fill="url(#gbpbottomshade)"></rect>
