<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="igbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"></stop>
      <stop offset="1" stop-color="#e4e4e4"></stop>
    </linearGradient>
    <pattern id="iggrain" width="3" height="2" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.35"></rect>
      <rect y="1" width="3" height="1" fill="#000000" fill-opacity="0.015"></rect>
    </pattern>
    <radialGradient id="igwarm" cx="0.85" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#b08930" stop-opacity="0.08"></stop>
      <stop offset="0.55" stop-color="#b08930" stop-opacity="0.02"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="igtopedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"></stop>
      <stop offset="0.08" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="iginnerglow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="igbottomshade" x1="0" y1="0.7" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0.06"></stop>
    </linearGradient>
    <clipPath id="igtileclip">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14"></rect>
    </clipPath>
  </defs>

  <g clip-path="url(#igtileclip)">
    <rect width="64" height="64" fill="url(#igbase)"></rect>
    <rect width="64" height="64" fill="url(#iggrain)" opacity="0.30"></rect>
    <rect width="64" height="64" fill="url(#igwarm)"></rect>
    <rect width="64" height="64" fill="url(#iginnerglow)"></rect>
    <rect width="64" height="64" fill="url(#igbottomshade)"></rect>
    <rect width="64" height="64" fill="url(#igtopedge)"></rect>
  </g>

  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" ry="13.4" fill="none" stroke="#2a2a2a" stroke-opacity="0.18" stroke-width="1.2"></rect>

  <defs>
    <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.00" stop-color="#FFDC80"></stop>
      <stop offset="0.12" stop-color="#FCAF45"></stop>
      <stop offset="0.22" stop-color="#F77737"></stop>
      <stop offset="0.32" stop-color="#F56040"></stop>
      <stop offset="0.45" stop-color="#FD1D1D"></stop>
      <stop offset="0.58" stop-color="#E1306C"></stop>
      <stop offset="0.70" stop-color="#C13584"></stop>
      <stop offset="0.82" stop-color="#833AB4"></stop>
      <stop offset="0.92" stop-color="#5851DB"></stop>
      <stop offset="1.00" stop-color="#405DE6"></stop>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#igGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="17" y="17" width="30" height="30" rx="8" ry="8"></rect>
    <circle cx="32" cy="32" r="7"></circle>
    <circle cx="40.5" cy="23.5" r="1.3" fill="url(#igGrad)" stroke="none"></circle>
  </g>
</svg>