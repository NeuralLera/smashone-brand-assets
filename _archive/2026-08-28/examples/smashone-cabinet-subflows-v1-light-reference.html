<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmashOne US — Cabinet Sub-flows</title>
<link rel="stylesheet" href="assets/colors_and_type.css">
<style>
  html, body { background: #f0eee9; }
  /* Lucide-style stroke icons baseline */
  .lu { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }
  .lu-sm { width: 16px; height: 16px; }
  .lu-lg { width: 24px; height: 24px; }
  .lu-xl { width: 32px; height: 32px; }
  .lu-2xl { width: 48px; height: 48px; }
  /* tabular helper */
  .tab { font-variant-numeric: tabular-nums lining-nums; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="cabinet-shell.jsx"></script>
<script type="text/babel" src="tokens-gallery.jsx"></script>
<script type="text/babel" src="subflow1-notifications.jsx"></script>
<script type="text/babel" src="subflow2-workspace.jsx"></script>
<script type="text/babel" src="subflow3-team.jsx"></script>
<script type="text/babel" src="subflow4-import.jsx"></script>
<script type="text/babel" src="subflow5-ai-training.jsx"></script>
<script type="text/babel" src="subflow6-coach-marks.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="intro" title="SmashOne US — Cabinet sub-flows" subtitle="Six recurring surfaces · Light theme v1.4 · Onest + Inter · Vivid Sovereign #b08930">
        <DCArtboard id="readme" label="Brief" width={520} height={780}>
          <Readme />
        </DCArtboard>
        <DCArtboard id="tokens" label="Tokens" width={720} height={780}>
          <TokenCard />
        </DCArtboard>
        <DCArtboard id="atoms" label="Atoms · components" width={900} height={780}>
          <AtomsGallery />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf1" title="1 · Notification panel" subtitle="/cabinet/notifications — right-side drawer · Cmd+K · 4 tab filters">
        <DCArtboard id="sf1-default" label="Desktop · default (3 unread)" width={1440} height={900}>
          <Notif state="default" />
        </DCArtboard>
        <DCArtboard id="sf1-empty" label="Empty state" width={1440} height={900}>
          <Notif state="empty" />
        </DCArtboard>
        <DCArtboard id="sf1-loading" label="Loading skeleton" width={1440} height={900}>
          <Notif state="loading" />
        </DCArtboard>
        <DCArtboard id="sf1-mobile" label="Mobile · full-screen drawer" width={390} height={780}>
          <Notif state="mobile" />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf2" title="2 · Multi-workspace switcher" subtitle="/cabinet/workspaces — top-bar dropdown + full management page">
        <DCArtboard id="sf2-dropdown" label="Desktop · top-bar dropdown open" width={1440} height={900}>
          <Workspace state="dropdown" />
        </DCArtboard>
        <DCArtboard id="sf2-full" label="Full management view" width={1440} height={900}>
          <Workspace state="full" />
        </DCArtboard>
        <DCArtboard id="sf2-mobile" label="Mobile · bottom sheet" width={390} height={780}>
          <Workspace state="mobile" />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf3" title="3 · Team invite flow" subtitle="/cabinet/team — list + modal with chip parsing + role cards">
        <DCArtboard id="sf3-list" label="Team list (5 members + 2 pending)" width={1440} height={900}>
          <Team state="list" />
        </DCArtboard>
        <DCArtboard id="sf3-modal" label="Invite modal · filled" width={1440} height={900}>
          <Team state="modal" />
        </DCArtboard>
        <DCArtboard id="sf3-success" label="Success — 3 invites sent" width={1440} height={900}>
          <Team state="success" />
        </DCArtboard>
        <DCArtboard id="sf3-mobile" label="Mobile · invite modal" width={390} height={780}>
          <Team state="mobile" />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf4" title="4 · Bulk import wizard" subtitle="/cabinet/import — 3-step wizard with column mapping + preview">
        <DCArtboard id="sf4-step1" label="Step 1 · select data type" width={1440} height={900}>
          <Import state="step1" />
        </DCArtboard>
        <DCArtboard id="sf4-step2" label="Step 2 · upload CSV (file ready)" width={1440} height={900}>
          <Import state="step2" />
        </DCArtboard>
        <DCArtboard id="sf4-step3" label="Step 3 · map columns + preview" width={1440} height={900}>
          <Import state="step3" />
        </DCArtboard>
        <DCArtboard id="sf4-progress" label="Importing… progress modal" width={1440} height={900}>
          <Import state="progress" />
        </DCArtboard>
        <DCArtboard id="sf4-done" label="Import complete · 247 / 3 / 12" width={1440} height={900}>
          <Import state="done" />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf5" title="5 · AI training detail" subtitle="/cabinet/ai/training — samples + tone + industry + playground">
        <DCArtboard id="sf5-default" label="Desktop · full page" width={1440} height={1640}>
          <Training state="default" />
        </DCArtboard>
        <DCArtboard id="sf5-generating" label="Playground · generating" width={1440} height={1640}>
          <Training state="generating" />
        </DCArtboard>
        <DCArtboard id="sf5-history" label="Training history modal" width={1440} height={900}>
          <Training state="history" />
        </DCArtboard>
      </DCSection>

      <DCSection id="sf6" title="6 · Coach marks / onboarding tour" subtitle="Overlay tour · 5 steps · spotlight + tooltip + progress dots">
        <DCArtboard id="sf6-step1" label="Step 1 · sidebar" width={1440} height={900}>
          <Coach state="step1" />
        </DCArtboard>
        <DCArtboard id="sf6-step2" label="Step 2 · create draft" width={1440} height={900}>
          <Coach state="step2" />
        </DCArtboard>
        <DCArtboard id="sf6-step4" label="Step 4 · notification bell" width={1440} height={900}>
          <Coach state="step4" />
        </DCArtboard>
        <DCArtboard id="sf6-step5" label="Step 5 · Cmd+K (last)" width={1440} height={900}>
          <Coach state="step5" />
        </DCArtboard>
        <DCArtboard id="sf6-done" label="Tour complete modal" width={1440} height={900}>
          <Coach state="done" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
